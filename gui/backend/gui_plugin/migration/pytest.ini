[pytest]
junit_family = xunit1
addopts = --color=yes -ra --doctest-glob="*.dt" --junitxml=plugin-tests.xml

[server]
; The port that the server should use to listen to connections (default: 8000)
; port = 8000

; Inhibit SSL for the socket connections (default: False)
; nossl = True
